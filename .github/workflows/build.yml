# Automatically build the project and run any configured tests for every push and submitted pull request.
# This can help catch issues that only occur on certain platforms or Java versions and provides a first line of defense against bad commits.

name: Build Orbit UI
on: [pull_request, push]

env:
  ULTRALIGHT_SDK_VERSION: "2.0.0-beta.2"

jobs:
  build:
    strategy:
      matrix:
        # Use these Java versions
        java: [
          21,    # Current Java LTS & minimum supported by Minecraft
        ]
        # Run on these operating systems
        os: [windows-2025-vs2026]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Setup JDK ${{ matrix.java }}
        uses: actions/setup-java@v6
        with:
          distribution: 'zulu'
          java-version: ${{ matrix.java }}
          cache: gradle

      - name: Cache Ultralight SDK
        id: cache-ultralight-sdk
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/ultralight-sdk
          key: ultralight-sdk-windows-x64-${{ env.ULTRALIGHT_SDK_VERSION }}

      - name: Download Ultralight SDK
        if: steps.cache-ultralight-sdk.outputs.cache-hit != 'true'
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/ultralight-sdk"
          gh release download "$ULTRALIGHT_SDK_VERSION" \
            --repo Ayydxn/Ultralight-SDKs \
            --pattern "ul-sdk-2.0.0-beta.2-win-x64-free.zip" \
            --output "$RUNNER_TEMP/sdk-archive"
          7z x "$RUNNER_TEMP/sdk-archive" -o"$RUNNER_TEMP/ultralight-sdk" -y
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Build
        run: ./gradlew build -Pultralight_sdk_location="${{ runner.temp }}/ultralight-sdk"
