# Gradle
org.gradle.jvmargs=-Xmx4G
org.gradle.parallel=true
org.gradle.daemon=true
org.gradle.debug=false

# Build Properties
maven_group=me.ayydxn.orbit
archives_name=orbit-ui

# Mod Properties
mod_name=Orbit UI
mod_version=2026.1.0
mod_id=orbit
mod_description=A Minecraft UI library that allows for creating menus and overlays made out of HTML and CSS, powered by the Ultralight web renderer.
mod_authors=Ayydxn
sources_url=https://github.com/Ayydxn/Orbit
issue_tracker_url=https://github.com/Ayydxn/Orbit/issues
license=LGPL-3.0-or-later
icon_path=icon.png

# Minecraft Properties
minecraft_version=1.20.1
minecraft_version_range=[1.20.1]
parchment_version=2023.09.03
enabled_platforms=fabric,forge

# Fabric Properties
# Check these on https://fabricmc.net/develop
fabric_api_version=0.92.11+1.20.1
fabric_loader_version=0.19.3

# Forge Properties
# Check these on https://files.minecraftforge.net/net/minecraftforge/forge/
forge_version=1.20.1-47.4.22
forge_version_range=[47,)

# Architectury Properties
architectury_api_version=9.2.14
architectury_version_range=[9.2,)

# Mod Dependencies
modmenu_version=7.2.2

# Dependencies
junit_version=6.1.3
